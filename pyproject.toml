[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infogain-tree"
version = "0.1.0"
description = "A from-scratch decision tree classifier using entropy and information gain, with tree display."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kranos212" }]
keywords = ["decision tree", "entropy", "information gain", "ID3", "machine learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.22", "pandas>=1.4"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]

[project.urls]
Homepage = "https://github.com/kranos212/Decision-tree"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"entropy_tree.datasets" = ["*.csv"]
